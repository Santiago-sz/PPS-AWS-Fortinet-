[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pps-desktop"
version = "0.1.0"
description = "Consola local de auditorías PPS AWS/Fortinet"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.2", "cryptography==50.0.1", "keyring==25.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyinstaller>=6,<7"]

[project.gui-scripts]
pps-desktop = "pps_desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pps_desktop*"]

[tool.setuptools.package-data]
pps_desktop = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
