[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pps-policy-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf==6.18.0", "python-docx==1.2.0", "lxml==6.1.3"]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
dev = ["pytest>=8,<10", "boto3>=1.34,<2", "moto[s3]>=5,<6"]

[project.scripts]
pps-api = "pps_api.__main__:main"

[tool.setuptools.packages.find]
include = ["pps_api*"]

[tool.pytest.ini_options]
pythonpath = [".", "../../desktop"]
testpaths = ["tests"]
