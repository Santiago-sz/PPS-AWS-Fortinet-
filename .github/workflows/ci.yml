# CI del repositorio PPS-AWS-Fortinet.
# Mismas órdenes que audit-engine/TESTING.md: si pasan localmente, pasan acá.
# Ningún job toca AWS: no hay credenciales, no hay terraform plan/apply,
# los tests mockean boto3/Bedrock/FortiGate y los evals corren offline.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lambda:
    name: lambda (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            audit-engine/requirements-dev.txt
            audit-engine/requirements.txt
      - name: Install dev + runtime deps
        run: python -m pip install -r requirements-dev.txt -r requirements.txt boto3
      - name: ruff check
        run: python -m ruff check generator/ executor/ contracts/ legacy/ tests/ evals/ scripts/build_layer.py
      - name: ruff format --check
        run: python -m ruff format --check generator/ executor/ contracts/ legacy/ tests/ evals/ scripts/build_layer.py
      - name: pytest
        # En Linux el test del backstop SIGALRM del sandbox corre de verdad
        # (en Windows se salta): se espera 276 passed, 0 skipped.
        run: python -m pytest -q -p no:cacheprovider

  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pps-policy-api[dev]
        # Los tests importan pps_desktop.api / pps_desktop.domain (stdlib-only);
        # pyproject añade ../gui al pythonpath de pytest, sin instalar Qt.
        run: python -m pip install -e "local-api[dev]"
      - name: pytest
        working-directory: local-api
        run: python -m pytest -q -p no:cacheprovider

  desktop:
    name: desktop (pytest, Qt offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libs for PySide6 offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install pps-desktop[dev]
        run: python -m pip install -e "gui[dev]"
      - name: ruff check
        working-directory: gui
        run: python -m ruff check .
      - name: pytest
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider

  terraform:
    name: terraform (fmt, validate, checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Lambda layer zip
        # aws_lambda_layer_version.doc_parsers usa filebase64sha256() sobre el
        # zip: tiene que existir antes de validate. Verifica además el layout
        # python/ y que no viaje boto3.
        run: python audit-engine/scripts/build_layer.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - name: terraform fmt -check
        working-directory: infrastructure/pipeline
        run: terraform fmt -check -recursive -diff
      - name: terraform init (no backend)
        working-directory: infrastructure/pipeline
        run: terraform init -backend=false -input=false
        env:
          TF_DATA_DIR: ${{ runner.temp }}/pps-terraform-data
      - name: terraform validate
        working-directory: infrastructure/pipeline
        run: terraform validate
        env:
          TF_DATA_DIR: ${{ runner.temp }}/pps-terraform-data
      - name: checkov (soft fail)
        # Informativo: los hallazgos abiertos y su justificación están en
        # infrastructure/pipeline/checkov-report.md. soft_fail evita bloquear el PR.
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/pipeline
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli

  evals-offline:
    name: evals (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boto3 (bedrock_client import)
        run: python -m pip install boto3
      - name: Run offline evals
        run: python audit-engine/evals/run_evals.py --mode offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-offline-results
          path: audit-engine/evals/results/*.json
          if-no-files-found: ignore
